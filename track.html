<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตามเอกสาร — Thanaphon Engineering</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun','Segoe UI',sans-serif;background:#f0ebe5;min-height:100vh;}
.header{background:#3d1f0a;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.header-logo{width:38px;height:38px;background:rgba(255,255,255,0.12);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.header-text h1{font-size:15px;font-weight:600;color:#fff;}
.header-text p{font-size:11px;color:rgba(255,255,255,0.55);margin-top:1px;}
.container{max-width:480px;margin:0 auto;padding:16px 14px 40px;}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 16px rgba(61,31,10,0.08);margin-bottom:12px;}
.card-header{padding:16px 18px 12px;border-bottom:1px solid #f0ebe5;display:flex;justify-content:space-between;align-items:flex-start;}
.doc-label{font-size:12px;color:#999;margin-bottom:3px;}
.doc-name{font-size:17px;font-weight:600;color:#1a1a1a;}
.doc-sub{font-size:12px;color:#777;margin-top:2px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:20px;}
.badge-dot{width:7px;height:7px;border-radius:50%;}
.badge-transit{background:#fff3e0;color:#b36200;}
.badge-transit .badge-dot{background:#f57c00;animation:pulse 1.5s infinite;}
.badge-delivered{background:#e8f5e9;color:#2e7d32;}
.badge-delivered .badge-dot{background:#43a047;}
.badge-problem{background:#fce4ec;color:#c62828;}
.badge-problem .badge-dot{background:#e53935;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #f0ebe5;}
.meta-cell{padding:11px 14px;border-right:1px solid #f0ebe5;}
.meta-cell:last-child{border-right:none;}
.meta-label{font-size:11px;color:#aaa;margin-bottom:3px;}
.meta-value{font-size:13px;font-weight:500;color:#1a1a1a;}
.tracking-box{margin:14px 18px;background:#f7f3ef;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;}
.tracking-label{font-size:11px;color:#aaa;margin-bottom:3px;}
.tracking-number{font-size:15px;font-weight:600;color:#1a1a1a;letter-spacing:0.5px;font-family:monospace;}
.copy-btn{background:#e8f0fe;color:#1a73e8;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;}
.carrier-btn{margin:0 18px 14px;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1.5px solid #f0ebe5;border-radius:12px;cursor:pointer;text-decoration:none;transition:border-color 0.15s;}
.carrier-btn:hover{border-color:#d4b896;background:#fdf8f4;}
.carrier-left{display:flex;align-items:center;gap:10px;}
.carrier-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;}
.carrier-name{font-size:13px;font-weight:500;color:#1a1a1a;}
.carrier-hint{font-size:11px;color:#aaa;margin-top:1px;}
.carrier-arrow{font-size:18px;color:#ccc;}
.timeline{padding:14px 18px 18px;}
.tl-title{font-size:11px;font-weight:600;color:#aaa;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:16px;}
.tl-item{display:flex;gap:14px;}
.tl-left{display:flex;flex-direction:column;align-items:center;}
.tl-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:2px;}
.tl-dot-done{background:#43a047;}
.tl-dot-active{background:#f57c00;box-shadow:0 0 0 4px rgba(245,124,0,0.15);}
.tl-dot-pending{background:#e0e0e0;}
.tl-line{width:2px;flex:1;background:#f0ebe5;min-height:30px;margin:4px 0;}
.tl-content{padding-bottom:20px;flex:1;}
.tl-event{font-size:14px;font-weight:500;color:#1a1a1a;}
.tl-event.active{color:#f57c00;}
.tl-event.pending{color:#bbb;}
.tl-desc{font-size:12px;color:#999;margin-top:2px;}
.tl-time{font-size:11px;color:#bbb;margin-top:3px;}
.proof-img-container{width:100%;border-radius:12px;overflow:hidden;background:#f7f3ef;cursor:pointer;}
.proof-img-container img{width:100%;display:block;}
.section-title{font-size:12px;font-weight:600;color:#aaa;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:10px;padding:0 2px;}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 6px rgba(61,31,10,0.05);text-decoration:none;}
.hist-name{font-size:13px;font-weight:500;color:#1a1a1a;}
.hist-sub{font-size:11px;color:#aaa;margin-top:2px;}
.loading{text-align:center;padding:60px 20px;color:#aaa;}
.loading-spinner{width:36px;height:36px;border-radius:50%;border:3px solid #f0ebe5;border-top-color:#3d1f0a;animation:spin 0.8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#fff;border-radius:16px;padding:40px 24px;text-align:center;}
.error-title{font-size:16px;font-weight:600;color:#c62828;margin-bottom:6px;}
.error-msg{font-size:13px;color:#999;}
.alert-problem{background:#fce4ec;border-left:4px solid #e53935;border-radius:10px;padding:12px 14px;margin:0 18px 14px;font-size:13px;color:#c62828;}
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="5" width="18" height="15" rx="2" stroke="white" stroke-width="1.8"/>
      <path d="M3 5V4a2 2 0 012-2h14a2 2 0 012 2v1" stroke="white" stroke-width="1.8"/>
      <path d="M8 12h8M8 16h5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>Thanaphon Engineering</h1>
    <p>ระบบติดตามเอกสาร</p>
  </div>
</div>
<div class="container">
  <div id="loading" class="loading"><div class="loading-spinner"></div><p>กำลังโหลดข้อมูล...</p></div>
  <div id="content" style="display:none;"></div>
</div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxTUpeLtLRs7t-olnYrylfz9RxOpdCZhpgXZe5JWUHH8foXjPM_JMaqc9RqPqHGi9bI/exec';
const CARRIER_COLORS = {'Kerry Express':'#ff6b00','ไปรษณีย์ไทย':'#c41e3a','Flash Express':'#ffc107','J&T Express':'#e53935','Ninja Van':'#7b1fa2','DHL':'#cc9900','SCG Express':'#1565c0'};
const STATUS_MAP = {transit:{label:'กำลังจัดส่ง',cls:'transit'},delivered:{label:'ได้รับแล้ว',cls:'delivered'},problem:{label:'มีปัญหา',cls:'problem'}};

function getIdFromUrl(){
  // 1. ลอง query string ก่อน ?id=xxx
  const qs = new URLSearchParams(window.location.search).get('id');
  if(qs) return qs;
  // 2. ลอง path /track/TPE-xxx
  const parts = window.location.pathname.split('/').filter(Boolean);
  // หา segment ที่ขึ้นต้นด้วย TPE-
  const seg = parts.find(p => p.startsWith('TPE-'));
  if(seg) return seg;
  // 3. segment สุดท้าย (fallback)
  const last = parts[parts.length-1];
  return (last && last !== 'track') ? last : null;
}

async function loadShipment(){
  const id=getIdFromUrl();
  if(!id){showError('ไม่พบรหัสเอกสาร','กรุณาตรวจสอบลิงก์ที่ได้รับจาก TPE');return;}
  try{
    const res=await fetch(API_URL+'?id='+encodeURIComponent(id));
    const data=await res.json();
    if(!data.ok){showError('ไม่พบข้อมูล',data.error||'ลิงก์อาจไม่ถูกต้อง');return;}
    render(data);
  }catch(e){showError('เกิดข้อผิดพลาด','ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');}
}

function render({shipment:s,logs,history}){
  document.getElementById('loading').style.display='none';
  const el=document.getElementById('content');
  el.style.display='block';
  const si=STATUS_MAP[s.status]||STATUS_MAP.transit;
  const cc=CARRIER_COLORS[s.carrier]||'#555';
  const stepDone=s.status==='delivered'?4:s.status==='problem'?2:3;
  const sentTime=s.created_at||'';
  const steps=[
    {label:'เตรียมเอกสารแล้ว',desc:'ออกเอกสารเรียบร้อย',time:sentTime},
    {label:'ส่งเอกสารแล้ว',desc:'ฝากกับ'+s.carrier,time:sentTime},
    {label:'อยู่ระหว่างขนส่ง',desc:'กำลังส่งไปยังปลายทาง',time:s.status==='transit'||s.status==='delivered'?sentTime:''},
    {label:'ได้รับเอกสารแล้ว',desc:'เอกสารส่งถึงผู้รับ',time:s.status==='delivered'?sentTime:''},
  ];
  const tlHTML=steps.map((step,i)=>{
    const done=(s.status==='delivered'?i<4:i<stepDone-1);
    const active=i===stepDone-1&&s.status!=='delivered';
    const isLast=i===steps.length-1;
    const dc=done?'tl-dot-done':active?'tl-dot-active':'tl-dot-pending';
    const tc=active?'active':i>=stepDone-1&&s.status!=='delivered'?'pending':'';
    return `<div class="tl-item"><div class="tl-left"><div class="tl-dot ${dc}"></div>${!isLast?'<div class="tl-line"></div>':''}</div><div class="tl-content" style="${isLast?'padding-bottom:0':''}"><div class="tl-event ${tc}">${step.label}</div><div class="tl-desc">${step.desc}</div>${step.time?`<div class="tl-time">${step.time}</div>`:''}</div></div>`;
  }).join('');
  // ชื่อที่แสดง: ถ้าใบส่งสินค้า → "ใบส่งสินค้า — ชื่อสินค้า", อื่นๆ → doc_type
  const docTitle = s.doc_type === 'ใบส่งสินค้า' && s.product_name
    ? `${s.doc_type} — ${s.product_name}`
    : s.doc_type;
  // บรรทัดหลัก: เลขที่เอกสาร, บรรทัดรอง: เลขที่เอกสาร (เดิมเป็นชื่อลูกค้า → เปลี่ยนเป็น doc_ref)
  el.innerHTML=`
    <div class="card">
      <div class="card-header">
        <div><div class="doc-label">${docTitle}</div><div class="doc-name">${s.doc_ref||s.id}</div><div class="doc-sub">${s.customer}</div></div>
        <span class="badge badge-${si.cls}"><span class="badge-dot"></span>${si.label}</span>
      </div>
      <div class="meta-grid">
        <div class="meta-cell"><div class="meta-label">วันที่ส่ง</div><div class="meta-value">${fmtDate(s.sent_date)}</div></div>
        <div class="meta-cell"><div class="meta-label">คาดถึง</div><div class="meta-value">${s.expected_date?fmtDate(s.expected_date):'—'}</div></div>
        <div class="meta-cell"><div class="meta-label">รหัส</div><div class="meta-value" style="font-size:11px;">${s.id}</div></div>
      </div>
      <div class="tracking-box">
        <div><div class="tracking-label">เลขพัสดุ</div><div class="tracking-number">${s.tracking_no||'—'}</div></div>
        <button class="copy-btn" onclick="copyText('${s.tracking_no}',this)">คัดลอก</button>
      </div>
      ${s.carrier_url?`<a href="${s.carrier_url}" target="_blank" class="carrier-btn"><div class="carrier-left"><div class="carrier-icon" style="background:${cc};">${s.carrier.substring(0,4).toUpperCase()}</div><div><div class="carrier-name">${s.carrier}</div><div class="carrier-hint">กดเพื่อติดตามบนเว็บขนส่ง</div></div></div><span class="carrier-arrow">›</span></a>`:''}
      ${s.status==='problem'?`<div class="alert-problem">มีปัญหาในการจัดส่ง — กรุณาติดต่อ TPE โดยตรง${s.note?': '+s.note:''}</div>`:''}
      <div class="timeline"><div class="tl-title">สถานะการจัดส่ง</div>${tlHTML}</div>
    </div>
    ${s.proof_url?`<div class="card"><div style="padding:14px 18px 14px;"><div class="tl-title" style="margin-bottom:10px;">หลักฐานการส่ง</div><div id="proofContent"></div></div></div>`:''}
    ${history.length>0?`<div><div class="section-title">ประวัติเอกสารของ ${s.customer}</div>${history.map(h=>`<a href="/track.html?id=${h.id}" class="hist-item"><div><div class="hist-name">${h.doc_type} — ${h.doc_ref||h.id}</div><div class="hist-sub">${fmtDate(h.sent_date)}</div></div><span class="badge badge-${(STATUS_MAP[h.status]||STATUS_MAP.transit).cls}" style="font-size:11px;"><span class="badge-dot"></span>${(STATUS_MAP[h.status]||STATUS_MAP.transit).label}</span></a>`).join('')}</div>`:''}
  `;
  if (s.proof_url) {
    document.getElementById('proofContent').innerHTML = renderProof(s.proof_url);
  }
}

function renderProof(url) {
  const extMatch = url.match(/ext=([a-z0-9]+)/i);
  const ext = extMatch ? extMatch[1].toLowerCase() : '';
  const isImage = ['jpg','jpeg','png','gif','webp','bmp'].includes(ext) || (!extMatch && url.includes('thumbnail'));
  const openUrl = url.includes('/view') 
    ? url.replace(/[&?]ext=[^&]*/,'')
    : url.replace(/[&?]ext=[^&]*/,'').replace('thumbnail?id=','uc?export=view&id=');
  const FILE_LABEL = {
    pdf:'📄 กดเพื่อเปิด PDF', doc:'📝 กดเพื่อเปิด Word', docx:'📝 กดเพื่อเปิด Word',
    xls:'📊 กดเพื่อเปิด Excel', xlsx:'📊 กดเพื่อเปิด Excel',
    zip:'🗜️ กดเพื่อดาวน์โหลด ZIP', rar:'🗜️ กดเพื่อดาวน์โหลด',
  };
  const label = FILE_LABEL[ext] || '📎 กดเพื่อดูไฟล์หลักฐาน';
  if (isImage) {
    const imgUrl = url.replace(/[&?]ext=[^&]*/,'');
    return `<div class="proof-img-container" onclick="window.open('${openUrl}','_blank')">
      <img src="${imgUrl}" alt="หลักฐาน" onerror="this.style.display='none';document.getElementById('proofFallback').style.display='flex'">
      <a id="proofFallback" href="${openUrl}" target="_blank" style="display:none;align-items:center;gap:8px;padding:14px;text-decoration:none;color:#1a73e8;font-size:13px;">${label}</a>
    </div>`;
  }
  return `<a href="${openUrl}" target="_blank" style="display:flex;align-items:center;gap:10px;padding:14px 16px;background:#f5f5f5;border-radius:12px;text-decoration:none;color:#1a73e8;font-size:14px;font-weight:500;">${label}</a>`;
}

function fmtDate(d){if(!d)return'—';const dt=new Date(d);if(isNaN(dt))return d;return dt.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});}
function copyText(t,btn){navigator.clipboard.writeText(t).then(()=>{const o=btn.textContent;btn.textContent='คัดลอกแล้ว!';btn.style.background='#e8f5e9';btn.style.color='#2e7d32';setTimeout(()=>{btn.textContent=o;btn.style.background='';btn.style.color='';},2000);});}
function showError(title,msg){document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';document.getElementById('content').innerHTML=`<div class="error-box"><div style="font-size:40px;margin-bottom:12px;">📭</div><div class="error-title">${title}</div><div class="error-msg">${msg}</div></div>`;}
loadShipment();
</script>
</body>
</html>
